name: Deploy static site

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Устанавливаем Node.js (нужен для работы npm и линтера)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Устанавливаем зависимости (скачиваем ESLint)
      - name: Install dependencies
        run: npm ci

      # 3. Вот он, наш новый шаг с линтингом!
      - name: Run Linter
        run: npm run lint

      # 4. Настройка Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Загрузка файлов для публикации
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Оставляем точку, так как твой index.html лежит в корне

      # 6. Публикация
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
